server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # 允许跨域 API；生产可将 connect-src 收紧到指定 API 域名。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # 首页与 hash 路由共用入口；API 请求不经过此服务器。
    location / { try_files $uri $uri/ =404; }
    location = /index.html {
        expires -1;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
}
