name: fastapi-learning
x-app: &app
  build: .
  environment:
    # 本机 HTTP 演示默认 development；正式 HTTPS 部署显式设为 production。
    APP_ENV: ${APP_ENV:-development}
    SESSION_HOURS: ${SESSION_HOURS:-8}
    DATABASE_URL: postgresql+asyncpg://demo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/demo
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
    AGENT_BACKEND: disabled
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173"]}
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:5173:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
volumes:
  postgres_data:
